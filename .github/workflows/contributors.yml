name: Contributors

# The wall lives in readme-contributors as a reusable workflow and is written
# straight to main after every merge, with no separate pull request. The
# organisation profile keeps its README at profile/README.md, so that is the
# file the wall fills.
#
# This used to be a copy of the job, and every run since 7 September failed:
# its git add named .github/contributors.svg, which html format never writes,
# so the step died with exit 128 before it could commit; and it pushed to a
# protected main with the workflow token, which the ruleset refuses. The
# profile's wall stayed empty.
#
# main is protected, so the wall pushes through the write deploy key stored as
# CONTRIBUTORS_DEPLOY_KEY. `secrets: inherit` hands it over.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@a7a404eee356cff3be78b6aaf419916909994b60 # v1.9.0
    with:
      readme: profile/README.md
      format: html
    secrets: inherit
